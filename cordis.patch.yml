# dsh-balance-pill bundle patch.
#
# Applied after the profile's in-box bundles; inserts the plugin row. The
# package is dual-face: this row is the node half (it registers the balance
# route on `ctx.webServer`), and the same package's `dsh.client` declaration is
# scanned into the browser roster (`window.__DSH_BOOT__`), where the client half
# contributes the composer-dock pill.
#
# No secret appears here: the API key is resolved per request from the
# credentials seam (falling back to $DEEPSEEK_API_KEY).

- insert:
    - id: dsh-balance-pill
      name: 'dsh-balance-pill'
      inject: [webServer]
      # Optional overrides (defaults shown):
      # config:
      #   refreshIntervalMs: 60000   # poll interval the browser half uses
      #   cacheMs: 20000             # upstream response cache lifetime
